[project]
name = "proper-bench"
version = "0.1.0"
description = "Benchmarks: Proper against Beego, Topcoat, Rails and Django"
requires-python = ">=3.14,<4"
dependencies = [
    "proper",
    "django>=6.1",
    "fastapi>=0.141.1",
    "sqlalchemy>=2.1.1",
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "jinja2>=3.1.6",
    "litestar>=2.24.0",
    "sanic>=25.12.1",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.6",
]

[tool.uv]
package = false

[tool.uv.sources]
proper = { path = "../proper", editable = true }

[tool.ruff]
line-length = 100
target-version = "py314"
